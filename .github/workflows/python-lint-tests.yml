name: CI

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master
      - release/*

# The version used for the single-job steps (lint, static analysis, code coverage). Must be one
# of the versions listed in the matrix below, otherwise those steps silently never run.
env:
  PRIMARY_PYTHON: '3.13'

jobs:

  # ----------------------------------------
  lint-tests:
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Just
      uses: extractions/setup-just@v4

    - name: Install Python
      uses: actions/setup-python@v7
      with:
          python-version: ${{ matrix.python-version }}

    - name: Install poetry
      run: pipx install --python ${{ matrix.python-version }} poetry

    # TODO: cache poetry venv

    - name: Install project
      run: |
        python --version
        poetry config virtualenvs.in-project true
        poetry env use ${{ matrix.python-version }}
        poetry install -E all --with docs,dev

    - name: Lint and static analysis
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PRIMARY_PYTHON  # no need to run that 9x
      run: |
        poetry run just lint

    # needed for tests to work on ubuntu (libEGL.so.1)
    - name: Install EGL mesa
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq libegl1-mesa-dev

    # PYTEST STRATEGY
    # macOS is the only runner who has working ModernGL behaviour
    # macOS + PRIMARY_PYTHON is used for code coverage
    - name: Pytest (code coverage)
      run: |
        poetry run pytest --cov=./ --cov-report=xml
      if: matrix.os == 'macos-latest' && matrix.python-version == env.PRIMARY_PYTHON
    - name: Pytest
      run: |
        poetry run pytest
      if: matrix.os == 'macos-latest' && matrix.python-version != env.PRIMARY_PYTHON
    - name: Pytest (no image similarity check)
      run: |
        poetry run pytest --skip-image-similarity
      if: matrix.os != 'macos-latest'
    - name: Upload comparison test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test_report_${{ runner.os }}_${{ matrix.python-version }}
        path: |
          test_report_img_sim/**/*
          test_report_reference_svg/**/*
        if-no-files-found: ignore
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
      if: matrix.os == 'macos-latest' && matrix.python-version == env.PRIMARY_PYTHON
